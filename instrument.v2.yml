name: Lizard
id: lizard
version: 1.19.2

actions:
  verify:
    with:
      requirements:
        - name: Python 3.9+
          min: 3.9.0
          command:
            windows: py -3 --version >nul 2>nul & if not errorlevel 1 (py -3 --version) else (python --version)
            unix: if command -v python3 >/dev/null 2>&1; then python3 --version; else python --version; fi
          match:
            - 'Python (?<version>.+)'
  start:
    commands:
      run-lizard:
        id: run-lizard
        dir: ${instrumentPath}
        command:
          windows: >-
            py -3 --version >nul 2>nul & if not errorlevel 1 (py -3 lizard.py -V --csv "${repo}" > "${instrumentPath}/results/${repoName}.csv") else (python lizard.py -V --csv "${repo}" > "${instrumentPath}/results/${repoName}.csv")
          unix: >-
            if command -v python3 >/dev/null 2>&1; then python3 lizard.py -V --csv "${repo}" > "${instrumentPath}/results/${repoName}.csv"; else python lizard.py -V --csv "${repo}" > "${instrumentPath}/results/${repoName}.csv"; fi

  summary:
    md-file: results/summary.md
    html-file: results/summary.html
    category: Structural Relations
    commands:
      generate-summary:
        id: generate-summary
        dir: ${instrumentPath}
        command:
          windows: py -3 --version >nul 2>nul & if not errorlevel 1 (py -3 lizard-summary.py "${instrumentPath}/results") else (python lizard-summary.py "${instrumentPath}/results")
          unix: if command -v python3 >/dev/null 2>&1; then python3 lizard-summary.py "${instrumentPath}/results"; else python lizard-summary.py "${instrumentPath}/results"; fi

  clean:
    with:
      locations:
        - source: ${instrumentDir}/results

  pack:
    with:
      locations:
        - source: ${instrumentDir}/results
          destination: /results
