# This workflow will create a release for Voyager
on:
  push:
    tags:
      - 'v*-voyager'

name: Create Release

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Assets
        run: |
          mkdir -p lizard/results
          mkdir -p lizard/templates

          cp README.rst lizard/README.rst
          cp LICENSE.txt lizard/LICENSE.txt
          cp instrument.yml lizard/instrument.yml
          cp instrument.v2.yml lizard/instrument.v2.yml
          cp lizard.py lizard/lizard.py
          cp summary_extract.py lizard/summary_extract.py
          cp summary_render.py lizard/summary_render.py
          cp lizard-summary.py lizard/lizard-summary.py
          cp templates/summary.html lizard/templates/summary.html
          cp -R lizard_ext lizard/lizard_ext
          cp -R lizard_languages lizard/lizard_languages

      - name: Create Archive
        run: zip -r lizard.zip lizard

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }} (Voyager)
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./lizard.zip
          asset_name: lizard-voyager.zip
          asset_content_type: application/zip
